<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Project Manager Administration | 1001328662 Ontario Inc.</title><meta name="robots" content="noindex,nofollow,noarchive">
  <style>
    :root{--ink:#172033;--muted:#606979;--line:#d7dbe2;--bg:#f4f5f7;--panel:#fff;--action:#25354d;--danger:#992727}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Arial,sans-serif}header,main,footer{width:min(1200px,calc(100% - 28px));margin:auto}
    header{padding:24px 0 18px;border-bottom:1px solid var(--line)}.company{font-size:18px;font-weight:700}.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:18px;margin:18px 0;overflow:auto}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
    button,a.button{display:inline-block;background:var(--action);color:#fff;border:0;border-radius:4px;padding:8px 11px;font-weight:700;cursor:pointer;text-decoration:none;margin:2px}
    button.secondary{background:#e6e9ee;color:var(--ink)}button.danger{background:var(--danger)}input,textarea,select{width:100%;padding:9px;border:1px solid #b7bec8;border-radius:4px;font:inherit}textarea{min-height:74px}
    label{display:block;font-weight:700}.muted{color:var(--muted)}.badge{display:inline-block;border:1px solid var(--line);padding:3px 8px;border-radius:99px}.actions{display:flex;gap:6px;flex-wrap:wrap}
    footer{text-align:center;color:var(--muted);padding:28px 0}@media(max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div class="company">1001328662 Ontario Inc.</div><div class="muted">Project Manager administration</div></header>
<main>
  <section class="card"><h1>Project Manager applications</h1><p>Private administrator access only. Your browser will request configured administrator credentials.</p><button id="load">Load applications</button><p id="message"></p><div id="applications"></div></section>
  <section id="detail" class="card" hidden><h2 id="detailTitle"></h2><div id="detailBody"></div></section>
</main>
<footer>&copy; 1001328662 Ontario Inc. All rights reserved.</footer>
<script>
  let auth="",selected;
  const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
  async function api(url,options={}){options.headers={...(options.headers||{}),...(auth?{Authorization:auth}:{})};const response=await fetch(url,options);if(response.status===401&&!auth){const user=prompt("Administrator username"),pass=prompt("Administrator password");auth="Basic "+btoa(user+":"+pass);return api(url,options)}const data=response.headers.get("content-type")?.includes("json")?await response.json():null;if(!response.ok)throw new Error(data?.error||"Request failed");return data}
  async function load(){try{const rows=await api("/api/admin/project-manager/applications");document.getElementById("applications").innerHTML='<table><thead><tr><th>Application</th><th>Business</th><th>Type</th><th>Status</th><th></th></tr></thead><tbody>'+rows.map(row=>'<tr><td>'+esc(row.applicationNumber)+'</td><td>'+esc(row.legalBusinessName)+'</td><td>'+esc(row.entityType)+'</td><td><span class="badge">'+esc(row.status)+'</span></td><td><button onclick="openDetail(\''+row.id+'\')">Manage</button></td></tr>').join("")+'</tbody></table>'}catch(error){document.getElementById("message").textContent=error.message}}
  async function openDetail(id){selected=await api("/api/admin/project-manager/applications/"+id);const a=selected.application;document.getElementById("detail").hidden=false;document.getElementById("detailTitle").textContent=a.applicationNumber+" - "+a.legalBusinessName;
    document.getElementById("detailBody").innerHTML='<div class="actions"><button onclick="approve()">Conditionally approve</button><button onclick="generate()">Generate agreement</button><a class="button" href="/api/admin/project-manager/applications/'+a.id+'/download">Application PDF</a></div><h3>Business information</h3><pre>'+esc(JSON.stringify(a,null,2))+'</pre><h3>Workers</h3>'+selected.workers.map(w=>'<div class="card"><strong>'+esc(w.legalName)+'</strong> - '+esc(w.relationshipType)+' <span class="badge">'+esc(w.status)+'</span><div class="actions"><button onclick="workerStatus(\''+w.id+'\',\'APPROVED\')">Approve</button><button class="danger" onclick="workerStatus(\''+w.id+'\',\'REJECTED\')">Reject</button><button class="secondary" onclick="workerStatus(\''+w.id+'\',\'SUSPENDED\')">Suspend</button></div></div>').join("")+'<h3>Agreements</h3>'+selected.agreements.map(g=>'<div class="card"><strong>'+esc(g.agreementNumber)+'</strong> <span class="badge">'+esc(g.status)+'</span><div class="actions"><a class="button" target="_blank" href="/api/admin/project-manager/agreements/'+g.id+'/preview">Preview</a><button class="secondary" onclick="amendAgreement(\''+g.id+'\')">Edit before sending / amend</button><button onclick="sendAgreement(\''+g.id+'\')">Send or resend</button><button onclick="countersign(\''+g.id+'\')">Countersign</button><a class="button" href="/api/admin/project-manager/agreements/'+g.id+'/download">Download</a><button class="secondary" onclick="suspendAgreement(\''+g.id+'\')">Suspend</button><button class="danger" onclick="supersedeAgreement(\''+g.id+'\')">Supersede</button><button class="danger" onclick="cancelAgreement(\''+g.id+'\')">Cancel draft</button><button class="secondary" onclick="createAssignment(\''+g.id+'\')">Assignment Confirmation</button></div></div>').join("")+'<h3>Audit trail</h3><pre>'+esc(JSON.stringify(selected.auditEvents,null,2))+'</pre>';
  }
  async function approve(){await api("/api/admin/project-manager/applications/"+selected.application.id+"/conditional-approval",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({notes:prompt("Conditional approval notes")||""})});openDetail(selected.application.id)}
  function commercialTerms(){return {rateTerms:prompt("Rates and rate basis (no universal rate)")||"Project-specific rates only, as stated in each Assignment Confirmation.",invoicingTerms:prompt("Invoicing terms")||"As configured for each project.",paymentTerms:prompt("Payment terms")||"As configured for each project; no payment period is implied.",insuranceTerms:prompt("Insurance requirements")||"As stated in Schedule E and each Assignment Confirmation.",cancellationTerms:prompt("Cancellation terms")||"As stated in each Assignment Confirmation.",terminationNotice:prompt("Termination notice")||"As permitted by the agreement and applicable law.",disputeTerms:prompt("Dispute terms")||"Good-faith negotiation, then the configured lawful process.",liabilityTerms:prompt("Liability terms")||"Subject to applicable law and configured insurance.",nonSolicitationDuration:prompt("Narrow non-solicitation duration")||"Not configured",nonSolicitationTerms:prompt("Narrow non-solicitation terms")||"No restriction unless expressly configured here."}}
  function schedules(){return (prompt("Select schedules, comma separated","A,B,C,D,E,F")||"").split(",").map(v=>v.trim().toUpperCase()).filter(v=>["A","B","C","D","E","F"].includes(v))}
  async function generate(){await api("/api/admin/project-manager/applications/"+selected.application.id+"/agreements",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({schedules:schedules(),commercialTerms:commercialTerms(),scheduleOverrides:{},status:"Draft"})});openDetail(selected.application.id)}
  async function amendAgreement(id){await api("/api/admin/project-manager/agreements/"+id+"/amend",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({schedules:schedules(),commercialTerms:commercialTerms(),scheduleOverrides:{},status:"Draft"})});openDetail(selected.application.id)}
  async function workerStatus(id,status){await api("/api/admin/project-manager/workers/"+id+"/status",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});openDetail(selected.application.id)}
  async function sendAgreement(id){const data=await api("/api/admin/project-manager/agreements/"+id+"/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({expiresInHours:72})});alert("Secure signing link sent. Expires "+data.expiresAt);openDetail(selected.application.id)}
  async function countersign(id){await api("/api/admin/project-manager/agreements/"+id+"/countersign",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({signerLegalName:prompt("Authorized signer legal name"),signerTitle:prompt("Signer title"),signatureText:prompt("Type full legal name as electronic signature")})});openDetail(selected.application.id)}
  async function suspendAgreement(id){await api("/api/admin/project-manager/agreements/"+id+"/suspend",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subject:prompt("Notice subject")||"Agreement suspended",body:prompt("Notice")||"Access and project issuance are suspended pending further notice."})});openDetail(selected.application.id)}
  async function supersedeAgreement(id){if(confirm("Supersede this agreement while preserving all executed versions?")){await api("/api/admin/project-manager/agreements/"+id+"/supersede",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});openDetail(selected.application.id)}}
  async function cancelAgreement(id){if(confirm("Cancel this unexecuted agreement?")){await api("/api/admin/project-manager/agreements/"+id+"/cancel",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reason:prompt("Cancellation reason")})});openDetail(selected.application.id)}}
  async function createAssignment(id){await api("/api/admin/project-manager/agreements/"+id+"/assignments",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({projectName:prompt("Project name"),clientSite:prompt("Client site"),scope:prompt("Project scope"),rates:{terms:prompt("Project-specific rates")},terms:{cancellation:prompt("Project cancellation terms")},workerIds:[],issue:confirm("Issue this Project Request now?")})});openDetail(selected.application.id)}
  document.getElementById("load").onclick=load;
</script>
</body>
</html>
